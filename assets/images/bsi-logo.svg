<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 90" width="300" height="90">
  <!-- BSI Bank Syariah Indonesia Logo Vector Style -->
  <defs>
    <linearGradient id="bsiTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A2B9"/>
      <stop offset="100%" stop-color="#008299"/>
    </linearGradient>
    <linearGradient id="bsiOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F37024"/>
      <stop offset="100%" stop-color="#E25510"/>
    </linearGradient>
  </defs>
  <!-- BSI Emblem Starburst / Flower -->
  <g transform="translate(15, 10)">
    <!-- Starburst segments -->
    <path d="M 35 35 L 35 5 A 30 30 0 0 1 56 14 Z" fill="url(#bsiTeal)"/>
    <path d="M 35 35 L 56 14 A 30 30 0 0 1 65 35 Z" fill="url(#bsiTeal)"/>
    <path d="M 35 35 L 65 35 A 30 30 0 0 1 56 56 Z" fill="url(#bsiTeal)"/>
    <path d="M 35 35 L 56 56 A 30 30 0 0 1 35 65 Z" fill="url(#bsiTeal)"/>
    <path d="M 35 35 L 35 65 A 30 30 0 0 1 14 56 Z" fill="url(#bsiTeal)"/>
    <path d="M 35 35 L 14 56 A 30 30 0 0 1 5 35 Z" fill="url(#bsiOrange)"/>
    <path d="M 35 35 L 5 35 A 30 30 0 0 1 14 14 Z" fill="url(#bsiOrange)"/>
    <path d="M 35 35 L 14 14 A 30 30 0 0 1 35 5 Z" fill="url(#bsiTeal)"/>
    <circle cx="35" cy="35" r="10" fill="#FFFFFF"/>
    <circle cx="35" cy="35" r="5" fill="url(#bsiTeal)"/>
  </g>
  <!-- Text BSI -->
  <text x="95" y="48" font-family="'Plus Jakarta Sans', 'Arial', sans-serif" font-weight="900" font-size="38" fill="#00A2B9" letter-spacing="1">BSI</text>
  <text x="96" y="65" font-family="'Plus Jakarta Sans', 'Arial', sans-serif" font-weight="600" font-size="11" fill="#666666" letter-spacing="2">BANK SYARIAH INDONESIA</text>
</svg>

